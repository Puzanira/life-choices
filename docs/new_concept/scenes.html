<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>«Спасибо, не надо» — Таблица сцен</title>
<style>
  :root{
    --cobalt:#1b3fd4; --yellow:#ffd400; --red:#e2231a; --orange:#ff7a00;
    --ink:#141414; --paper:#fffdf7; --line:#e6e0cf;
    --pos:#127a2e; --neg:#c0261e;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px; line-height:1.45;
  }
  header{background:var(--cobalt); color:#fff; padding:18px 22px; box-shadow:0 2px 0 var(--yellow);}
  header h1{margin:0; font-size:22px; letter-spacing:.5px; text-transform:uppercase;}
  header p{margin:6px 0 0; opacity:.9; font-size:13px;}
  .toolbar{
    position:sticky; top:0; z-index:5; background:var(--paper);
    padding:12px 22px; border-bottom:1px solid var(--line);
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=search]{
    padding:8px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; min-width:240px; flex:1;
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap}
  .chip{
    padding:6px 11px; border-radius:999px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-size:12px; font-weight:600; user-select:none;
  }
  .chip.active{background:var(--cobalt); color:#fff; border-color:var(--cobalt)}
  .count{font-size:12px; opacity:.6; margin-left:auto}
  .src{font-size:11px; opacity:.6; margin-left:8px}
  .wrap{overflow:auto; max-height:calc(100vh - 150px); padding:0 22px 40px}
  table{border-collapse:separate; border-spacing:0; width:100%; min-width:1500px}
  thead th{
    position:sticky; top:0; z-index:3; background:var(--ink); color:#fff;
    text-align:left; padding:10px 10px; font-size:12px; text-transform:uppercase;
    letter-spacing:.3px; border-right:1px solid #333;
  }
  tbody td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; border-right:1px solid #f0ead9;}
  tbody tr:nth-child(even){background:#faf6ea}
  tbody tr:hover{background:#fff6cf}
  td.id{font-weight:700; font-family:ui-monospace,Menlo,monospace; white-space:nowrap}
  td.card{font-weight:600; min-width:200px}
  td.when{white-space:nowrap; font-size:12px; opacity:.85}
  td.cons{min-width:210px; font-size:13px}
  td.delta{white-space:nowrap; font-weight:600; font-size:13px}
  td.delta .pos{color:var(--pos)} td.delta .neg{color:var(--neg)}
  td.host{font-style:italic; color:#7a4a00}
  td.host .bubble{
    display:inline-block; background:var(--yellow); color:var(--ink);
    padding:2px 9px; border-radius:12px 12px 12px 3px; font-style:normal;
    font-weight:600; font-size:12px; border:1px solid #e6bd00;
  }
  td.necro{min-width:210px; font-size:13px; color:#333}
  td.flags{white-space:normal; min-width:130px}
  .flag{
    display:inline-block; font-family:ui-monospace,Menlo,monospace; font-size:11px;
    background:#eef; color:#1b3fd4; padding:1px 6px; border-radius:4px; margin:1px 2px 1px 0;
  }
  .flag.fatal{background:#fdecea; color:var(--red)}
  .flag.open{background:#eafbea; color:var(--pos)}
  .flag.chain{background:#fff0e0; color:var(--orange)}
  tr[data-phase="Интро"] td.id{box-shadow:inset 4px 0 var(--yellow)}
  tr[data-phase="Детство"] td.id{box-shadow:inset 4px 0 var(--orange)}
  tr[data-phase="Юность"] td.id{box-shadow:inset 4px 0 #17a2b8}
  tr[data-phase="Взрослая"] td.id{box-shadow:inset 4px 0 var(--cobalt)}
  tr[data-phase="Кризис"] td.id{box-shadow:inset 4px 0 var(--red)}
  tr[data-phase="Поздняя"] td.id{box-shadow:inset 4px 0 #6f42c1}
  tr[data-phase="Случайные"] td.id{box-shadow:inset 4px 0 #333}
  tr[data-phase="Кек"] td.id{box-shadow:inset 4px 0 #d63384}
  .empty{opacity:.3}
  footer{padding:14px 22px; font-size:12px; opacity:.65}
</style>
</head>
<body>
<header>
  <h1>«Спасибо, не надо»</h1>
  <p>Правь <code>scenes.csv</code> в любом текстовом редакторе — таблица обновится после перезагрузки (Cmd+R). Запускай через <code>open-table.command</code>.</p>
</header>

<div class="toolbar">
  <input type="search" id="q" placeholder="Поиск по тексту, ID, флагам…">
  <div class="chips" id="phaseChips"></div>
  <span class="count" id="count"></span>
  <span class="src" id="src"></span>
</div>

<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<footer>Цвет полоски у ID = фаза жизни. Жёлтое облачко = реплика Ведущего. Δшкалы — качественно (+/−); точные числа в <code>game-design.md</code>.</footer>

<script>
const PHASE = {I:"Интро",CH:"Детство",YA:"Юность",MD:"Взрослая",CR:"Кризис",LT:"Поздняя",RND:"Случайные",KEK:"Кек"};
function phaseOf(id){const m=id.match(/^[A-Z]+/);return PHASE[m?m[0]:""]||"—";}

function parseCSV(text){
  const rows=[]; let row=[], field="", i=0, inQ=false;
  text=text.replace(/\r/g,"");
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue;}
      field+=c;i++;continue;
    }
    if(c==='"'){inQ=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\n'){row.push(field);field="";if(row.length>1||row[0]!=="")rows.push(row);row=[];i++;continue;}
    field+=c;i++;
  }
  if(field!==""||row.length){row.push(field);if(row.length>1||row[0]!=="")rows.push(row);}
  return rows;
}

const colClass=["id","card","when","type","cons","delta","cons","delta","host","host","necro","necro","flags"];

function deltaHTML(v){
  if(!v||v==="—")return '<span class="empty">—</span>';
  return v.replace(/([+])(\d|\S)/g,'<span class="pos">$1$2</span>')
          .replace(/([−-])(\d|\S)/g,'<span class="neg">$1$2</span>')
          .replace(/±/g,'<span class="neg">±</span>');
}
function hostHTML(v){ return v?('<span class="bubble">'+v+'</span>'):'<span class="empty">—</span>'; }
function flagsHTML(v){
  if(!v||v==="—")return '<span class="empty">—</span>';
  return v.split(/,\s*/).map(f=>{
    let cls="flag";
    if(/FATAL/.test(f))cls+=" fatal";
    else if(/OPEN/.test(f))cls+=" open";
    else if(/CHAIN/.test(f))cls+=" chain";
    return '<span class="'+cls+'">'+f+'</span>';
  }).join(" ");
}
function cell(v){ return (!v||v==="—")?'<span class="empty">—</span>':v; }

let headers=[], data=[];
const head=document.getElementById('head');
const body=document.getElementById('body');

function build(text){
  const rows=parseCSV(text.trim());
  headers=rows[0];
  data=rows.slice(1).map(r=>{const o={};headers.forEach((h,i)=>o[h]=(r[i]||"").trim());return o;});
  head.innerHTML="";
  headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;head.appendChild(th);});
  buildChips();
  apply();
}

function render(list){
  body.innerHTML="";
  list.forEach(o=>{
    const tr=document.createElement('tr');
    tr.dataset.phase=phaseOf(o.ID);
    headers.forEach((h,i)=>{
      const td=document.createElement('td');
      td.className=colClass[i];
      const v=o[h];
      if(colClass[i]==="delta")td.innerHTML=deltaHTML(v);
      else if(colClass[i]==="host")td.innerHTML=hostHTML(v);
      else if(colClass[i]==="flags")td.innerHTML=flagsHTML(v);
      else td.innerHTML=cell(v);
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  document.getElementById('count').textContent=list.length+" из "+data.length+" карточек";
}

let activePhase="Все", query="";
const chipBox=document.getElementById('phaseChips');
function buildChips(){
  chipBox.innerHTML="";
  ["Все",...Object.values(PHASE)].forEach(p=>{
    const c=document.createElement('span');
    c.className="chip"+(p==="Все"?" active":"");
    c.textContent=p;
    c.onclick=()=>{activePhase=p;[...chipBox.children].forEach(x=>x.classList.remove('active'));c.classList.add('active');apply();};
    chipBox.appendChild(c);
  });
}
function apply(){
  const q=query.toLowerCase();
  render(data.filter(o=>{
    const okPhase=activePhase==="Все"||phaseOf(o.ID)===activePhase;
    const okQ=!q||Object.values(o).some(v=>v.toLowerCase().includes(q));
    return okPhase&&okQ;
  }));
}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;apply();});

(async function init(){
  let text=null, src="встроенная копия";
  try{
    const r=await fetch('scenes.csv',{cache:'no-store'});
    if(r.ok){ text=await r.text(); src="scenes.csv (live)"; }
  }catch(e){}
  if(!text){ text=document.getElementById('csv').textContent; }
  document.getElementById('src').textContent="источник: "+src;
  build(text);
})();
</script>
</body>
</html>
